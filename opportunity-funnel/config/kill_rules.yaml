# Kill rules. These are defaults; the founder may edit them.
# The scripts in pipeline/ read this file. Nothing here is hard-coded elsewhere.
# "(spec)" = from the founder's instructions. "(default)" = added to make a rule mechanical; change freely.

stage1:
  rooms_min: 80                 # (spec) generate 80–120 rooms
  rooms_max: 120                # (spec)
  lenses: [life_stage, profession, transition, obligation, business_type, identity_community]   # (spec) six lenses
  min_rooms_per_lens: 8         # (default) so no lens is token-sized
  gap_pass: true                # (spec) each lens asks "which rooms are missing?"
  geography_filter: false       # (spec) rooms are generated worldwide; geography is never a filter by itself

stage2:
  max_rooms: 15                 # (spec) keep up to 15 rooms
  warn_below_rooms: 5           # (spec, earlier brief) fewer than 5 survivors -> say so in REVIEW.md
  min_ladder_steps: 3           # (spec) at least 3 paid problems in sequence
  require_measured_spend: true  # (spec) at least one concrete price with a URL
  reach_kinds: [warm, search]   # (spec) warm = matches a ledger warm path; search = already buys this kind of product via search, app stores or public marketplaces
  depth_must_match_ledger: true # (spec) its domain is in the ledger's depth list
  # Tie-break when more than max_rooms survive: (spec, earlier brief) longest ladder, then strongest spend evidence
  # (verified price points, then price points, then ladder steps that carry a seen price),
  # then (default) warm reach before search reach, then slug.
  rank_by: [ladder_steps, spend_points_verified, spend_points, priced_ladder_steps, warm_reach]

stage3:
  lookback_months: 24           # (spec, earlier brief) the last 24 months
  min_records_per_room: 500     # (spec) at least 500 where available
  saturation_window: 300        # (spec) stop when the last 300 new records add no new pain and change no pain's rank
  saturation_from_round: 2      # (conservative reading, logged) "at least 500 records, then continue until...": round 1 builds the pain list, so saturation is tested only on records collected after it
  saturation_window_whole_round: true   # (conservative reading, logged) when the latest round adds more than saturation_window records, the window is that whole round (the order inside a round is only query order)
  saturation_min_member_records: 30     # (conservative reading, logged) a window with fewer member records cannot show a new pain, so it is not evaluable and the room keeps listening
  max_rounds: 8                 # (default) safety stop; hitting it is logged as "not saturated"
  exhausted_round_new_records: 50   # (default) a round of new queries that adds fewer records than this = source exhausted (logged)
  exhausted_round_new_member_records: 10   # (conservative reading, logged) from round 3 on, if the previous round's records hold fewer member records than this, the room's public text has run out of member voice: the planner writes no queries and the room stops as exhausted (not saturated; it needs calls)
  min_source_kinds: 3           # (spec) at least three kinds of source per room where they exist; a record's kind is the kind of site its URL points to (config/source_kinds.yaml); fewer -> the room's pains are tagged [source kinds: N], not killed
  source_kind_min_records: 5    # (default, logged) a kind counts for a room only with at least this many records, so one stray link is not a kind
  include_undated_records: true # (default, logged) search-result records usually carry no date; they are kept and tagged [undated]. Records whose URL shows a date older than the lookback are dropped.
  drop_if_no_money_no_failed_spend_no_urgency: true   # (spec) drop test A
  min_verified_quotes: 2        # (spec) drop test B
  quotes_per_pain_min: 3        # (spec)
  quotes_per_pain_max: 5        # (spec)
  quote_min_words: 5            # (default)
  thin_below_records: 15        # (spec) fewer member records -> [thin]
  spend_sources_min: 2          # (spec) spending evidence confirmed by at least 2 independent sources (distinct domains); fewer -> tagged [spend: N source(s)] with the real count, not killed
  max_pains_total: 25           # (spec) keep up to 25 pains across all rooms
  rank_by: [failed_spend_mentions, money_mentions, urgency, record_count]   # (spec)
  urgency_order: [deadline_or_rule, acute_pain, fear, expiring_gain, none]  # (spec) best first

stage4:
  walkers_per_pain: 2           # (spec) two independent walkers, then a comparator
  kill_only_if_outcome_reached_today: true   # (spec)
  unsure_counts_as: melts       # (spec)
  # (spec) where the walkers disagree, take the more conservative reading:
  #   outcome reached today if EITHER walker says so; a wall persists only if BOTH say it persists;
  #   a wall counts for the pair only if BOTH walkers put it on the path (after the comparator reconciles IDs).
  conservative_merge: true

stage5:
  alternative_pairs_min: 2      # (spec) draft 2–3 alternative pairs, keep the strongest
  alternative_pairs_max: 3
  min_entry_walls: 3            # (spec)
  adjacency_slack_steps: 1      # (default) see pipeline/README.md
  lane_preference: [business, partner, trade]   # (default) the strongest valid alternative wins; ties go to the comparator's own ranking
  trade:
    max_build_weeks: 2
    payment_upfront: true
    subscriptions_allowed: false
    exit_date_required: true

stage6:
  max_survivors: 5              # (spec) keep up to 5 survivors
  compare_currency: USD         # (spec) every figure converted to US dollars at the current rate
  cases: [low, base, high]      # (spec) price, conversion rate and acquisition cost each have low/base/high
  # (default) "numbers work inside the ledger" means ALL of these hold in the BASE case:
  min_usd_per_hour_vs_hour_value: 1.0   # USD per hour of founder time must be at least the ledger's hour value (x this factor)
  cash30_must_cover_acquisition: true   # first-30-day cash per customer >= acquisition cost per customer (cash + founder time at the ledger's hour value)
  max_days_to_first_payment: 60
  first_cohort_customers: 5             # the first cohort's hours must fit the ledger's weekly hours (low end)
  guarantee_exposure_within_reserve: true
  live_delivery_must_fit_window: true   # live sessions must fit evenings/weekends IST (the model states it; the script checks the flag)
  rank_by: [opens_ladder, days_to_first_payment, usd_per_hour_base, evidence_strength]   # (spec)
  opens_ladder_max_position: 1          # (default) "opens the ladder" = step 1 of the room's ladder
  evidence_labels:                      # (default) how "evidence strength" is labeled
    strong: {failed_spend_min: 3, member_records_min: 30, spend_sources_min: 2}
    moderate: {failed_spend_min: 1, or_money_min: 3, member_records_min: 15}
