            techjockey.com, edureviewer.com, selecthub.com, itqlick.com, softwarefinder.com, technologycounter.com,
            sourceforge.net]
  jobs: [naukri.com, indeed.com, indeed.ae, monster.com, foundit.in, iimjobs.com, instahyre.com, wellfound.com,
         upwork.com, freelancer.com, workindia.in, shine.com, apna.co, bayt.com, gulftalent.com, naukrigulf.com,
         ziprecruiter.com, simplyhired.com, careerbuilder.com, onlinejobs.ph, jobstreet.com, builtin.com]
  official: [sec.gov, irs.gov, ets.org, cfainstitute.org, rbi.org.in, sebi.gov.in, irdai.gov.in, dubailand.gov.ae,
             trai.gov.in, tdra.gov.ae, ftc.gov, fcc.gov, sba.gov, justice.gov, fincen.gov, federalregister.gov,
             ofcom.org.uk, iibf.org.in, epa.gov, dre.ca.gov]
  news: [gulfnews.com, business-standard.com, techcrunch.com, businesswire.com, prnewswire.com, globenewswire.com,
         economictimes.indiatimes.com, livemint.com, moneycontrol.com, thehindu.com, hindustantimes.com, forbes.com,
         reuters.com, bloomberg.com, cnbc.com, khaleejtimes.com, thenationalnews.com, inc42.com, yourstory.com,
         entrepreneur.com, inc.com, wsj.com, ft.com, nytimes.com, bbc.com, bbc.co.uk, arabianbusiness.com, zawya.com,
