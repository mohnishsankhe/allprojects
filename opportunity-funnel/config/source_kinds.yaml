# Hosts ending in one of these are official (governments and public bodies).
official_suffixes: [.gov, .gov.in, .nic.in, .gov.ae, .gov.uk, .gov.au, .gov.sg, .gov.ph, .gc.ca, .europa.eu, .mil]

# Hosts starting with one of these are forums or Q&A boards on otherwise unknown sites.
host_prefixes:
  forum: [forum., forums., community., discuss., discussion., boards., talk.]
  qa: [answers., ask.]

default: blog_or_site
