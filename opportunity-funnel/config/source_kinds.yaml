# Kinds of source, for the Stage 3 rule "at least 3 source kinds per room" (kill_rules.yaml: stage3.min_source_kinds).
# Every record arrives through web search, so a record's kind is the kind of site its URL points to.
# Matching (records.source_kind): a host matches a domain when it equals it or ends with "." + domain.
# Order: path rules, then domains, then official suffixes, then host prefixes. Anything else is blog_or_site
# (blogs, vendor and product sites, reference pages), which is a kind too.
# A kind counts for a room only when it holds at least stage3.source_kind_min_records records.

path_rules:
  - {domain: linkedin.com, path_prefix: /jobs, kind: jobs}
  - {domain: glassdoor.com, path_prefix: /job, kind: jobs}
  - {domain: glassdoor.co.in, path_prefix: /job, kind: jobs}
  - {domain: facebook.com, path_prefix: /groups, kind: forum}
  - {domain: shiksha.com, path_prefix: /ask, kind: qa}

domains:
  forum: [reddit.com, news.ycombinator.com, teamblind.com, indiehackers.com, biggerpockets.com, myprepclub.com,
          gmatclub.com, analystforum.com, 300hours.com, basenotes.com, fragrantica.com, salongeek.com, skool.com,
